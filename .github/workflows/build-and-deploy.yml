name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - '**/moonbit/**'
      - '**/cpp/CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
    inputs:
      projects:
        description: 'Space-separated project names to build (leave empty for all)'
        required: false
        default: ''

concurrency:
  group: build-and-deploy
  # Do not interrupt an in-flight Release asset replacement.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Job 1: Build all games in parallel chunks ──────────────────────────────
  build:
    name: Build (${{ matrix.chunk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chunk: A-C
            pattern: 'RaylibA* RaylibB* RaylibC*'
          - chunk: D-M
            pattern: 'RaylibD* RaylibE* RaylibF* RaylibG* RaylibH* RaylibI* RaylibJ* RaylibK* RaylibL* RaylibM*'
          - chunk: N-R
            pattern: 'RaylibN* RaylibO* RaylibP* RaylibQ* RaylibR*'
          - chunk: S
            pattern: 'RaylibS*'
          - chunk: T-Z
            pattern: 'RaylibT* RaylibU* RaylibV* RaylibW* RaylibX* RaylibY* RaylibZ*'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit
        run: moon version

      - name: Update MoonBit registry
        run: moon update

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Install Android NDK and CMake
        env:
          NDK_VERSION: 28.2.13676358
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Build projects
        env:
          MAX_PARALLEL: '4'
          MAX_RETRIES: '2'
        run: |
          if [[ -n "${{ github.event.inputs.projects }}" ]]; then
            bash scripts/build_games.sh ${{ github.event.inputs.projects }}
          else
            # Expand the glob pattern for this chunk
            cd "$GITHUB_WORKSPACE"
            PROJECTS=()
            for pat in ${{ matrix.pattern }}; do
              for d in $pat; do
                [[ -f "${d}/gradlew" ]] && PROJECTS+=("$(basename $d)")
              done
            done
            bash scripts/build_games.sh "${PROJECTS[@]}"
          fi

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p /tmp/apks
          find . -maxdepth 8 -name "app-debug.apk" -path "*/outputs/apk/debug/*" | \
          while read apk; do
            proj=$(echo "$apk" | cut -d/ -f2)
            cp "$apk" "/tmp/apks/${proj}.apk"
          done
          echo "Collected $(ls /tmp/apks/ 2>/dev/null | wc -l) APKs"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.chunk }}
          path: /tmp/apks/*.apk
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.chunk }}
          path: build_logs/
          retention-days: 3
          if-no-files-found: ignore

  # ── Job 2: Publish Release APKs + regenerate GitHub Pages ─────────────────
  deploy:
    name: Deploy
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: android-games

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to push gh-pages

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apks-*
          path: /tmp/apks
          merge-multiple: true

      - name: Upload APKs to GitHub Releases
        env:
          APK_DIR: /tmp/apks
        run: bash scripts/upload_apks.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site
        env:
          OUTPUT_DIR: docs
        run: python3 scripts/generate_site.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          commit_message: 'Deploy: update site [${{ github.sha }}]'
